<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Codexと育てる、個人用の知識インデックス">
  <title>Knowledge Index | Technical Notes</title>
  <link rel="stylesheet" href="styles/site.css?v=20260702-source-label">
  <script src="scripts/index.js?v=20260702-render" defer></script>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Technical Notes</p>
    <h1>技術メモと参照リンク</h1>
    <p class="lead">外部資料URLと、自分の疑問から作った解説ノートを同じ一覧で管理します。読む入口は軽く、深掘りしたいテーマは静的 HTML ノートとして残します。</p>
  </header>

  <main class="page-shell">
    <div class="toolbar">
      <input id="search" type="search" placeholder="タイトル・キーワードで検索" aria-label="知識インデックスを検索">
      <select id="kind" aria-label="種類で絞り込み">
        <option value="">すべての種類</option>
        <option value="note">解説ノート</option>
        <option value="source">外部資料</option>
      </select>
      <select id="category" aria-label="カテゴリで絞り込み">
        <option value="">すべてのカテゴリ</option>
        <option value="ai-development">AI開発</option>
        <option value="frontend">フロントエンド</option>
        <option value="infrastructure">インフラ</option>
        <option value="security">セキュリティ</option>
        <option value="workflow">ワークフロー</option>
      </select>
    </div>

    <section class="note-grid" id="notes" aria-label="知識インデックス"></section>
    <p class="empty" id="empty">該当する項目はありません。</p>
  </main>

  <footer class="page-shell footer">Review before publishing. Do not store secrets.</footer>
</body>
</html>
