<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Codexと育てる、個人用の技術ノート">
  <title>Technical Notes</title>
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Technical Notes</p>
    <h1>疑問を、その場で<br>読み返せる知識へ。</h1>
    <p class="lead">Codex App に投げた質問を、一次情報と図解を含む静的 HTML ノートとして蓄積します。</p>
  </header>

  <main class="page-shell">
    <div class="toolbar">
      <input id="search" type="search" placeholder="タイトル・キーワードで検索" aria-label="ノートを検索">
      <select id="category" aria-label="カテゴリで絞り込み">
        <option value="">すべてのカテゴリ</option>
        <option value="security">セキュリティ</option>
        <option value="workflow">ワークフロー</option>
      </select>
    </div>

    <section class="note-grid" id="notes" aria-label="ノート一覧">
      <a class="note-card" href="notes/2026-06-08-bearer-token/" data-title="Bearerトークンって何？" data-category="security" data-keywords="bearer token oauth access token jwt authorization api security">
        <span class="tag">セキュリティ</span>
        <h2>Bearerトークンって何？</h2>
        <p>「持っている人が使える」トークンの仕組みと、安全に扱うための注意点。</p>
        <time datetime="2026-06-08">2026-06-08</time>
      </a>
      <a class="note-card" href="notes/2026-06-08-codex-note-workflow/" data-title="Codex Appで技術ノートを育てる" data-category="workflow" data-keywords="codex html github pages knowledge notes">
        <span class="tag">ワークフロー</span>
        <h2>Codex Appで技術ノートを育てる</h2>
        <p>質問から調査、HTML化、レビュー、公開までの最小運用。</p>
        <time datetime="2026-06-08">2026-06-08</time>
      </a>
    </section>
    <p class="empty" id="empty">該当するノートはありません。</p>
  </main>

  <footer class="page-shell footer">Review before publishing. Do not store secrets.</footer>

  <script>
    const search = document.querySelector("#search");
    const category = document.querySelector("#category");
    const cards = [...document.querySelectorAll(".note-card")];
    const empty = document.querySelector("#empty");

    function filterNotes() {
      const query = search.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach((card) => {
        const text = `${card.dataset.title} ${card.dataset.keywords}`.toLowerCase();
        const matches = text.includes(query) && (!category.value || card.dataset.category === category.value);
        card.hidden = !matches;
        if (matches) visible += 1;
      });
      empty.style.display = visible ? "none" : "block";
    }

    search.addEventListener("input", filterNotes);
    category.addEventListener("change", filterNotes);
  </script>
</body>
</html>
